# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 2 GB was not enough to build all four variants in one go: R8 and the Compose compiler both
# want room, and the build died with an OutOfMemoryError rather than a compile error.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.code.style=official

# The JDK is found on its own — JAVA_HOME, the JVM Gradle itself runs on, or any installed
# toolchain. A hard-coded path belonged to one machine and broke the build on every other.
# To pin one anyway, set it locally (never commit it), for example:
# org.gradle.java.home=/Users/you/Library/Java/JavaVirtualMachines/ms-21.0.12/Contents/Home
org.gradle.java.installations.auto-detect=true
